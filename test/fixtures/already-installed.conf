# A tmux.conf in the state /clux:setup leaves it after a first successful
# run: the source-file line, and both token strings inserted into the value
# that already renders (status-format[0] here) at the positions Part 2 of
# the design fixes — session-bar right after the first #[align=left...]
# segment's leading field, notification immediately before the first
# #[align=right], prefixed with #[align=centre].
set -g status-interval 2
set -g status-left-length 150
set -g 'status-format[0]' '#[align=left] #h #{@clux_session_bar}#(~/.config/clux/scripts/session-bar-refresh.sh quiet)#[align=centre]#{@clux_status}#[align=right]%H:%M '
set -g monitor-bell on
set -g bell-action any

source-file -q ~/.config/clux/clux.tmux.conf
