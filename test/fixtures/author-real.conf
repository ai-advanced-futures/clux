# set default shell
set -g default-command "$SHELL"

# Clean up stale clux lock on config load
run-shell "rm -rf ~/.config/tmux/claude_notification.lock ~/.config/tmux/claude_notification.flock 2>/dev/null; true"

# When last window in a session is destroyed, switch to another session instead of detaching
set -g detach-on-destroy off

# history size
set -g history-limit 2000

# bind with C-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -sg escape-time 0
set -g focus-events on

# window navigation
bind n next-window
bind p previous-window

# session navigation
bind N run-shell '~/.config/tmux/scripts/switch-session.sh next'
bind P run-shell '~/.config/tmux/scripts/switch-session.sh prev'

# reorder sessions in the status bar (custom order stored in @session_order)
# NOTE: overrides default { / } (swap-pane -U / -D)
bind '{' run-shell '~/.config/tmux/scripts/session-reorder.sh left'
bind '}' run-shell '~/.config/tmux/scripts/session-reorder.sh right'

# quick notes scratchpad popup
bind C-n display-popup -w 80% -h 80% -E "nvim ~/notes.md"

# temporary popup terminal in current directory
bind C-c display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "$SHELL"

# neogit popup (nvim opens directly into Neogit)
bind C-g display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "$SHELL -ilc '~/.config/tmux/scripts/neogit-popup.sh'"

# btop system monitor popup
bind C-t display-popup -w 80% -h 80% -E "btop"

# native tmux session/window tree picker
bind s   choose-tree -Zs
bind C-x choose-tree -Zs

# force redraw of all panels (resize cycle with delay)
bind R resize-pane -R 1 \; run-shell 'sleep 0.05' \; resize-pane -L 1 \; \
  display-message "display refreshed"

# unbind keys
unbind Up
unbind Down
unbind Left
unbind Right

# general settings
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
# Keep tmux from capturing mouse events so Ghostty cmd-click URL opening works.
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1

# Enable activity/bell monitoring
set -g monitor-bell on
set -g bell-action any

bind r source-file ~/.config/tmux/tmux.conf \; \
  display-message "config re-sourced"

# move around with vi keys
set-window-option -g mode-keys vi

##############
### COLORS ###
##############

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Pane borders (Nord palette)
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#A3BE8C"
set -g pane-border-status top
set -g pane-border-format '#[fg=#4C566A] #{?pane_active,#[fg=#A3BE8C],#[fg=#4C566A]}#{pane_title} #{?pane_active,#[fg=#D08770]│ #[fg=#EBCB8B],#[fg=#4C566A]│ }#{pane_current_command} '

####################
### CLIPBOARD ###
####################

# Enable OSC 52 clipboard support
set -g set-clipboard on

# Copy mode vi bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Platform-specific clipboard integration
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
}

if-shell "uname | grep -q Linux && command -v xclip > /dev/null 2>&1" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"
}

####################
### PANE CONTROL ###  (tmux-pain-control inlined)
####################

# Pane navigation (vi-style)
bind-key h   select-pane -L
bind-key C-h select-pane -L
bind-key j   select-pane -D
bind-key C-j select-pane -D
bind-key k   select-pane -U
bind-key C-k select-pane -U
bind-key l   select-pane -R
bind-key C-l select-pane -R

# Pane resizing
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Pane splitting (open in current path)
bind-key "|"  split-window -h  -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-"  split-window -v  -c "#{pane_current_path}"
bind-key "_"  split-window -fv -c "#{pane_current_path}"
bind-key "%"  split-window -h  -c "#{pane_current_path}"
bind-key '"'  split-window -v  -c "#{pane_current_path}"

# Window management
bind-key "c" new-window -c "#{pane_current_path}"
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Prompt for a name, then open a new window running `claude --worktree $NAME`
bind-key W command-prompt -p "Worktree name:" "new-window -n '%1' -c '#{pane_current_path}' '$SHELL -ilc \"claude --worktree %1\"'"

####################
### SESSIONS ###  (tmux-sessionist inlined)
####################

bind-key g   run-shell -b "~/.config/tmux/scripts/fzf-session-switch.sh"
bind-key S   switch-client -l
bind-key C   run-shell "~/.config/tmux/plugins/tmux-sessionist/scripts/new_session_prompt.sh"
bind-key A   command-prompt -p "Session name:" "run-shell '~/.config/tmux/scripts/new-session-prompt.sh \"%1\"'"
bind-key @   run-shell "~/.config/tmux/plugins/tmux-sessionist/scripts/promote_pane.sh '#{session_name}' '#{pane_id}' '#{pane_current_path}'"
bind-key C-@ run-shell "~/.config/tmux/plugins/tmux-sessionist/scripts/promote_window.sh '#{session_name}' '#{window_id}' '#{window_name}' '#{pane_current_path}'"
bind-key t   run-shell "~/.config/tmux/plugins/tmux-sessionist/scripts/join_pane.sh 'join-pane' '-b'"
bind-key X   run-shell "~/.config/tmux/plugins/tmux-sessionist/scripts/kill_session_prompt.sh '#{session_name}' '#{session_id}'"

####################
### OPEN ###  (tmux-open inlined, macOS)
####################

bind-key -T copy-mode-vi o send-keys -X copy-pipe-and-cancel "sed 's/##/####/g' | xargs -I {} tmux run-shell -b 'cd #{pane_current_path}; open \"{}\" > /dev/null'"
bind-key -T copy-mode    o send-keys -X copy-pipe-and-cancel "sed 's/##/####/g' | xargs -I {} tmux run-shell -b 'cd #{pane_current_path}; open \"{}\" > /dev/null'"
bind-key -T copy-mode-vi C-o send-keys -X copy-pipe-and-cancel "sed 's/##/####/g' | xargs -I {} sh -c 'tmux send-keys \"nvim -- \\\"{}\\\"\" Enter'"
bind-key -T copy-mode    C-o send-keys -X copy-pipe-and-cancel "sed 's/##/####/g' | xargs -I {} sh -c 'tmux send-keys \"nvim -- \\\"{}\\\"\" Enter'"

####################
### SEND-TO-PANE ###
####################

# fzf pane picker — send buffer to any pane across sessions (also S from copy mode)
bind-key V run-shell -b "~/.config/tmux/scripts/send-to-pane.sh"
bind-key -T copy-mode-vi S send-keys -X copy-pipe-and-cancel "tmux run-shell -b '~/.config/tmux/scripts/send-to-pane.sh'"

# Quick directional paste — prefix+v then h/j/k/l (also s then h/j/k/l from copy mode)
bind-key v switch-client -T send-to-pane
bind-key -T copy-mode-vi s send-keys -X copy-pipe-and-cancel "tmux switch-client -T send-to-pane"
bind-key -T send-to-pane h paste-buffer -t '{left-of}'  \; select-pane -L
bind-key -T send-to-pane j paste-buffer -t '{down-of}'  \; select-pane -D
bind-key -T send-to-pane k paste-buffer -t '{up-of}'    \; select-pane -U
bind-key -T send-to-pane l paste-buffer -t '{right-of}' \; select-pane -R
bind-key -T send-to-pane s paste-buffer

# fzf command picker — scan pane for commands, pick one, paste into target pane
bind-key e run-shell -b "~/.config/tmux/scripts/command-picker.sh"

# Pull, the reverse of the command picker above: stay on the current pane,
# scan a neighboring pane for commands, paste the pick here. With exactly one
# other pane in the window it pulls straight from it; with more, prefix+E
# then h/j/k/l picks which neighbor to pull from.
bind-key E run-shell -b "~/.config/tmux/scripts/pull-from-pane.sh"
bind-key -T pull-from-pane h run-shell -b "~/.config/tmux/scripts/pull-from-pane.sh '{left-of}'"
bind-key -T pull-from-pane j run-shell -b "~/.config/tmux/scripts/pull-from-pane.sh '{down-of}'"
bind-key -T pull-from-pane k run-shell -b "~/.config/tmux/scripts/pull-from-pane.sh '{up-of}'"
bind-key -T pull-from-pane l run-shell -b "~/.config/tmux/scripts/pull-from-pane.sh '{right-of}'"

####################
### FZF ###  (tmux-fzf + tmux-fzf-url inlined)
####################

bind-key f run-shell -b "~/.config/tmux/plugins/tmux-fzf/main.sh"
bind-key u run-shell -b "~/.config/tmux/plugins/tmux-fzf-url/fzf-url.rb"
set -g @fzf-url-history-limit '2000'

####################
### STATUS BAR ###
####################

set-option -g status-position top
set -g status-interval 2
set-option -g status "on"

# Status bar colors
set -g status-style bg='#2E3440',fg='#88C0D0'
set -g status-left-length 150
set -g status-right-length 80

# Window status format
set -g window-status-format "#[fg=#88C0D0] #{=24:window_name} "
set -g window-status-current-format "#[bg=#88C0D0,fg=#2E3440,bold] #{=24:window_name} "
set -g window-status-separator ""

# Window list alignment
set -g status-justify right

# Prefix/copy-mode indicator: the hostname itself changes color
# (red = prefix active, blue = copy mode, cyan = idle) instead of a
# separate [P]/[C] label, to save status bar space.

# Single status bar: sessions + windows (left) | git (right)
set -g status-left ""
set -g status-right ""
set -g 'status-format[0]' '#[align=left,bg=#2E3440]#{?client_prefix,#[bg=#BF616A#,fg=#ECEFF4#,bold] #h #[default],#{?pane_in_copy_mode,#[bg=#5E81AC#,fg=#ECEFF4#,bold] #h #[default],#[fg=#88C0D0#,bold] #h #[default]}} #{@session_bar}#[align=centre]#(~/.config/clux/scripts/show-notification.sh)#[align=right]#(cd "#{pane_current_path}" && [ -f package.json ] && echo "#[fg=#88C0D0]  $(~/.local/share/fnm/aliases/default/bin/node -v) #[default]#[fg=#4C566A]│#[default]")#(cd "#{pane_current_path}" && { [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] || [ -d .venv ]; } && v=$(python3 -V 2>/dev/null | cut -d" " -f2) && venv="" && { [ -d .venv ] && venv=" 󰏗 .venv"; } && echo "#[fg=#EBCB8B]  $v$venv #[default]#[fg=#4C566A]│#[default]")#(cd "#{pane_current_path}" && ~/.config/tmux/scripts/git.sh)#(~/.config/tmux/scripts/session-bar-refresh.sh quiet) '

# --- session bar: instant updates ---
# The bar renders the pre-computed #{@session_bar} string (an inline option,
# evaluated on every redraw) instead of a live #() job, which tmux caches and
# only re-runs every status-interval (~2s lag on session/window switches).
# These hooks recompute @session_bar the moment the relevant state changes so
# switches reflect immediately. -g (replace, not -ga append) keeps reloads
# idempotent — nothing else hooks these events, so a single entry is correct.
set-hook -g client-session-changed 'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
set-hook -g after-select-window    'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
set-hook -g session-created        'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
set-hook -g session-closed         'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
# Window add/remove. Closing a window fires window-unlinked; it was not wired, so
# the bar kept the dead window until the next status-interval tick — the ~2s lag
# on closing a window.
#
# window-linked is the symmetric add event, and it strictly supersedes the
# after-new-window hook that used to live here (measured on tmux 3.4):
#   new-window  -> after-new-window + window-linked
#   break-pane  -> window-linked only
#   move-window -> window-linked + window-unlinked
# Keeping both meant every new-window refreshed the bar twice, while break-pane
# and move-window were not covered at all. window-linked alone fixes both.
#
# Deliberately NOT session-window-changed: it also fires on plain window
# switching, which after-select-window already covers, so wiring both would
# refresh twice on every switch.
set-hook -g window-unlinked        'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
set-hook -g window-linked          'run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"'
# seed once at load so the bar isn't empty before the first event/interval
run-shell "~/.config/tmux/scripts/session-bar-refresh.sh"

# Message style
# `fill=` makes the prompt/message cover the full status bar width. Without it,
# tmux 3.7+ draws the message on top of the normal status line and only the
# typed characters get the message background.
set -g message-style "bg=#EBCB8B,fg=#2E3440,bold,fill=#EBCB8B,align=left"
set -g message-command-style "bg=#EBCB8B,fg=#2E3440,bold,fill=#EBCB8B,align=left"

# --- clux: Claude Code notifications (managed by /clux:setup) ---
set -g @claude-notify-bg "#EBCB8B"
set -g @claude-notify-fg "#2E3440"
# Linux-only: disable sound. clux only plays via afplay (macOS); on Linux the
# default sound path (/System/Library/Sounds/Blow.aiff) doesn't exist and clux
# flashes "clux: sound file not found" before the real notification appears.
if-shell '[ "$(uname)" = "Linux" ]' \
  'set -g @claude-notify-notification-sound "off" ; \
   set -g @claude-notify-stop-sound "off" ; \
   set -g @claude-notify-prompt-sound "off"'
# Agent state (the glyph column in @session_bar, see scripts/session-list.sh).
# clux redraws with `refresh-client -S` by default, which is enough only when
# the bar reads agent state through a #(...) job. This bar does not: it renders
# the pre-computed @session_bar option, and a redraw re-reads that option
# without rebuilding it. So point clux at the rebuild script instead. The value
# is split into arguments on spaces, so no argument may contain one.
set -g @clux-agent-refresh-command "run-shell -b ~/.config/tmux/scripts/session-bar-refresh.sh"

# Looking at a window clears the "done" mark for the agents in it. Only "done"
# is cleared — an agent that is working, or that wants an answer, keeps its mark
# until it says otherwise.
#
# The index is what makes these additions rather than replacements: an unindexed
# set-hook writes index 0, which is where the session-bar-refresh hooks above
# already live, so it would silently drop them.
set-hook -g 'after-select-window[90]'     "run-shell \"~/.config/clux/scripts/agent-clear.sh '#{window_id}'\""
set-hook -g 'client-session-changed[90]'  "run-shell \"~/.config/clux/scripts/agent-clear.sh '#{window_id}'\""

# Pane ids are reused after a tmux server restart, so a mark left over from the
# previous server could land on an unrelated pane. Clear the dead ones once, at
# load, before any of them can be read.
run-shell "~/.config/clux/scripts/agent-clear.sh --reap"

bind-key m run-shell "~/.config/clux/scripts/jump-to-notification.sh"
bind-key \` run-shell "~/.config/clux/scripts/dismiss-notification.sh"
bind-key DC run-shell "~/.config/clux/scripts/dismiss-notification.sh"
bind-key M display-popup -w 80% -h 60% -E "~/.config/clux/scripts/notification-picker.sh"
# --- end clux ---

##########################
### RESURRECT ###
##########################

# tmux-resurrect: manual save/restore (no auto-save)
set -g @resurrect-save-dir "~/.config/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"

# prefix + Ctrl+s  → save session
# prefix + Ctrl+r  → restore session
set -g @resurrect-save "C-s"
set -g @resurrect-restore "C-r"

run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
