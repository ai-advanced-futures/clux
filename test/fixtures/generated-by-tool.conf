# DO NOT EDIT — generated by tmuxifier from ~/.tmux/config.yml
# Any change here is overwritten on the next `tmuxifier build`.
#
# The sixth corpus shape from the config-updater design. /clux:setup must
# REFUSE this one: an edit here is silently reverted the next time the
# generator runs, so the user would be left with a clux install that
# disappears without explanation. Refusing and explaining is the correct
# outcome; guessing is not.
set -g status-interval 2
set -g status-left-length 80
set -g status-left "#S "
set -g status-right "%H:%M"
set -g monitor-bell on
