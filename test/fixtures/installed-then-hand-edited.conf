# Same install as already-installed.conf, but the user has since hand-edited
# the file: added an unrelated binding and a comment below clux's section.
# The invariant this corpus case exercises: a second /clux:setup run (or any
# tooling that re-checks the invariant) must still find exactly one
# source-file line and exactly one of each token — the user's own additions
# must never be mistaken for a second, stray install.
#
# 3.3/3.4-era install: the "quiet" job carries no #{client_pid} argument, same
# as already-installed.conf — left on the legacy form so this era stays
# represented in the corpus.
set -g status-interval 2
set -g status-left-length 150
set -g 'status-format[0]' '#[align=left] #h #{@clux_session_bar}#(~/.config/clux/scripts/session-bar-refresh.sh quiet)#[align=centre]#{@clux_status}#[align=right]%H:%M '
set -g monitor-bell on
set -g bell-action any

source-file -q ~/.config/clux/clux.tmux.conf

# --- hand-added after install, unrelated to clux ---
bind-key C-g display-popup -w 80% -h 80% -E "lazygit"
set -g @my-custom-plugin-option "some value"
