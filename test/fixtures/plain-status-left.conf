# A bare tmux.conf that builds its bar from status-left/status-right only —
# no status-format[N] override, no clux wiring yet.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-interval 5
set -g status-left-length 60
set -g status-left "#S "
set -g status-right "%H:%M"
set -g mouse on
set -g history-limit 5000

bind r source-file ~/.tmux.conf \; display-message "reloaded"
