# A tmux.conf that overrides status-format[0] instead of status-left/right —
# the shape the original setup-tmux-conf.sh could not detect at all (problem
# 1 in the config-updater design). status-left is intentionally left at its
# tmux default (unset), so probing status-format[0] against tmux's own
# built-in default is the only way to tell this apart from a bare config.
set -g status-interval 2
set -g status-left-length 100
set -g 'status-format[0]' '#[align=left]#[fg=white,bg=blue] #{session_name} #[default]#[align=right]%H:%M '
set -g monitor-bell on
set -g bell-action any
